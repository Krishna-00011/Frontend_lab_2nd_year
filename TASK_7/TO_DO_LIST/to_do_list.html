<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .container {
            width: 450px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: 2px solid #eee;
            border-radius: 10px;
            outline: none;
            font-family: inherit;
            transition: 0.3s;
        }

        input:focus {
            border-color: #764ba2;
        }

        button {
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
        }

        .add-btn {
            background: #764ba2;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
        }

        .add-btn:hover {
            background: #5a3285;
            transform: translateY(-2px);
        }

        h3 {
            margin: 30px 0 15px;
            color: #444;
        }

        ul {
            list-style: none;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background: #f5f3fa;
            padding: 13px;
            margin-bottom: 12px;
            border-radius: 10px;
            border-left: 4px solid #764ba2;
            animation: appear 0.3s ease;
            overflow-wrap: anywhere;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .delete-btn {
            background: #ff4757;
            color: white;
            padding: 7px 12px;
            border-radius: 7px;
            flex-shrink: 0;
        }

        .delete-btn:hover {
            background: #d63031;
            transform: scale(1.05);
        }

        .empty {
            text-align: center;
            color: #999;
            padding: 15px;
        }

        @media(max-width: 480px) {
            .container {
                padding: 22px;
            }

            h1 {
                font-size: 25px;
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>✨ My To-Do List</h1>

        <p class="subtitle">
            Plan your day. Complete your goals.
        </p>

        <div class="input-area">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
            >

            <button class="add-btn" id="addBtn">
                + Add
            </button>

        </div>

        <h3>My Tasks</h3>

        <ul id="taskList">

            <li class="empty">No tasks added yet!</li>

        </ul>

    </div>


    <script>

        let input = document.getElementById("taskInput");

        let addBtn = document.getElementById("addBtn");

        let taskList = document.getElementById("taskList");


        // Add Task Function

        function addTask() {

            let task = input.value.trim();

            if (task === "") {

                alert("Please enter a task!");

                return;

            }

            // Remove empty message

            if (taskList.querySelector(".empty")) {

                taskList.innerHTML = "";

            }

            // Create list item

            let li = document.createElement("li");

            li.textContent = task;


            // Create delete button

            let deleteBtn = document.createElement("button");

            deleteBtn.textContent = "Delete";

            deleteBtn.className = "delete-btn";


            // Delete task using event listener

            deleteBtn.addEventListener("click", function() {

                li.remove();

                if (taskList.children.length === 0) {

                    taskList.innerHTML =
                        '<li class="empty">No tasks added yet!</li>';

                }

            });


            // Add button to list item

            li.appendChild(deleteBtn);


            // Add task to list

            taskList.appendChild(li);


            // Clear input

            input.value = "";

        }


        // Add event listener

        addBtn.addEventListener("click", addTask);


        // Enter key to add task

        input.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {

                addTask();

            }

        });

    </script>

</body>

</html>
