<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let num = 12321;
        let k = num;
        let rev = 0;
        while (k > 0) {
            let rem = k % 10;
            rev = rev * 10 + rem;
            k = Math.floor(k / 10);
        }
        if (num == rev) {
            console.log(num + " is a palindrome number.");
        }
    </script>
</body>

</html>
